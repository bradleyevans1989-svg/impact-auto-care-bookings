services:
  - type: web
    name: impact-auto-care-bookings
    runtime: node
    plan: starter            # a paid plan is needed for the persistent disk that holds the database
    region: singapore        # closest Render region to NSW
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: bookings-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # set this yourself in the Render dashboard
      - key: RESEND_API_KEY
        sync: false          # optional: email notifications
      - key: EMAIL_FROM
        sync: false          # optional: e.g. Impact Auto Care <bookings@impactautocare.com.au>
      # Impact Diesel Group booking app (/diesel)
      - key: DIESEL_LINK_SECRET
        generateValue: true
      - key: DIESEL_SMTP_HOST
        sync: false          # outgoing mail server for service@impactdiesel.com.au
      - key: DIESEL_SMTP_PORT
        sync: false
      - key: DIESEL_SMTP_USER
        sync: false
      - key: DIESEL_SMTP_PASS
        sync: false
